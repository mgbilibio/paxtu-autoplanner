name = "paxtu-xai-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-04"
workers_dev = true

# github.io e localhost/127.0.0.1 (qualquer porta) estão sempre liberados no código.
# ALLOW_LOCALHOST ficou sem efeito; o campo existe só para não quebrar deploys antigos.
[vars]
ALLOW_LOCALHOST = "1"
